# Royal Inn Tartus — nginx inside the container.
# TLS ends at the proxy in front of it (Coolify / Traefik); this server only answers plain HTTP on port 80.

map $uri $royalinn_cache {
    default        "no-cache";
    ~^/assets/     "public, max-age=31536000, immutable";
    ~^/panel/      "no-store";
}
map $uri $royalinn_robots { default ""; ~^/panel/ "noindex, nofollow"; ~^/api/ "noindex"; }
map $http_x_real_ip $royalinn_client { default $http_x_real_ip; "" $remote_addr; }

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    autoindex off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json application/xml text/plain image/svg+xml;

    # security headers — set once here; no location below adds its own header, so these always apply
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $royalinn_cache always;
    add_header X-Robots-Tag $royalinn_robots always;
    # www -> bare domain (the proxy passes the visitor's Host header through)
    if ($host = www.royalinntartus.com) { return 301 https://royalinntartus.com$request_uri; }

    location = /manifest.webmanifest { types { } default_type application/manifest+json; }

    # the bare address goes straight to the Arabic home page (a real redirect, so search engines pass the root's links on)
    location = / { return 301 /ar/; }

    # booking requests and the hotel's panel API (python, same container)
    location /api/ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $royalinn_client;
        proxy_hide_header Cache-Control;
        proxy_read_timeout 20s;
    }

    # clean addresses: /ar/rooms.html -> /ar/rooms, /ar/index.html -> /ar/
    if ($request_uri ~ "^/index\.html(\?.*)?$")        { return 301 /; }
    if ($request_uri ~ "^/(.+)/index\.html(\?.*)?$")   { return 301 /$1/; }
    if ($request_uri ~ "^/(.+)\.html(\?.*)?$")         { return 301 /$1; }

    # nothing hidden or left-over is served (.git, .env, backups); /.well-known stays open
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(bak|old|orig|swp|sql|zip|tar|gz|log|ini|conf|sh|py|md)$ { return 404; }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
